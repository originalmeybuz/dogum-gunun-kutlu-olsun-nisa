<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun!</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); /* Hafif gri-beyaz arka plan */
            font-family: 'Great Vibes', cursive;
            text-align: center;
            overflow: hidden;
        }

        .container {
            position: relative;
            z-index: 10;
            padding: 20px;
        }

        /* Fotoğraf Stili */
        .photo-frame {
            width: 250px;
            height: 250px;
            margin: 0 auto 30px;
            border-radius: 50%; /* Yuvarlak resim */
            border: 5px solid #ff6b6b; /* Çerçeve rengi */
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            overflow: hidden;
            background-color: #fff;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Yazı Stili */
        h1 {
            font-size: 4rem;
            color: #ff6b6b;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: bounce 2s infinite;
        }

        p {
            font-size: 2rem;
            color: #555;
            margin-top: 10px;
        }

        /* Ufak bir zıplama animasyonu */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }
        
        /* Mobilde yazı boyutunu ayarla */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .photo-frame { width: 200px; height: 200px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="photo-frame">
            <img src="arkadasim.jpg" alt="Doğum Günü Çocuğu">
        </div>
        <h1>Doğum Günün Kutlu Olsun!</h1>
        <p>Nice mutlu, sağlıklı yaşlara...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // Sayfa yüklendiğinde konfeti patlat
        window.onload = function() {
            var duration = 3 * 1000; // 3 saniye sürsün
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                // Ekranın rastgele yerlerinden konfeti fırlat
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        };

        // Ekrana tıklandığında tekrar konfeti patlat
        document.addEventListener('click', function() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        });
    </script>
</body>
</html>
