<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun!</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Arka plan rengini buradan değiştirebilirsin */
            background-color: #000; 
            font-family: 'Great Vibes', cursive;
            overflow: hidden;
            position: relative;
        }

        /* Fotoğrafı Arka Plan Yapma Ayarı */
        .background-photo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.6; /* Fotoğrafı biraz soluklaştırır ki yazı okunsun (0.1 ile 1 arası) */
        }
        
        .background-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Resmi ekrana doldurur */
            object-position: center;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 5rem; /* Yazı boyutu */
            color: #fff; /* Yazı rengi beyaz */
            margin: 0;
            text-shadow: 0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(255, 105, 180, 0.6); /* Yazının arkasına gölge */
            animation: pulse 2s infinite;
        }

        p {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 5px rgba(0,0,0,0.9);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            p { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="background-photo">
        <img src="enguzel.jpg" alt="Dogum Gunu">
    </div>

    <div class="content">
        <h1>Doğum Günün Kutlu Olsun!</h1>
        <p>İyi ki doğdun, iyi ki varsın...</p>
