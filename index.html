<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun!</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000; 
            font-family: 'Great Vibes', cursive;
            overflow: hidden;
            position: relative;
        }

        .background-photo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.6; 
        }
        
        .background-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: center;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 5rem; 
            color: #fff; 
            margin: 0;
            text-shadow: 0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(255, 105, 180, 0.6); 
            animation: pulse 2s infinite;
        }

        p {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 5px rgba(0,0,0,0.9);
            margin-top: 10px;
        }

        /* 👇 YENİ: silik "ekrana tıkla" */
        .tap-hint {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #fff;
            opacity: 0.4;
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 600px) {
            body {
                justify-content: flex-start; 
                padding-top: 50px;
            }
            .content {
                width: 100%; 
                box-sizing: border-box;
            }
            h1 { font-size: 3.5rem; }
            p { font-size: 1.5rem; }
            .tap-hint { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <audio id="birthdayMusic" src="dogumgunuhayaletleri.mp3" loop hidden></audio>

    <div class="background-photo">
        <img src="enguzel.jpg" alt="Dogum Gunu">
    </div>

    <div class="content">
        <h1>Doğum Günün Kutlu Olsun!</h1>
        <p>İyi ki doğdun, iyi ki varsın...</p>
        <div class="tap-hint">ekrana tıkla</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        var duration = 15 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

        function randomInRange(min, max) { return Math.random() * (max - min) + min; }

        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return clearInterval(interval);
            var particleCount = 50 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, {
                particleCount,
                origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
            }));
            confetti(Object.assign({}, defaults, {
                particleCount,
                origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
            }));
        }, 250);

        document.addEventListener('click', function() {
            var music = document.getElementById('birthdayMusic');
            if (music.paused) {
                music.play().catch(() => {});
            }
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
        }, { once: true });
    </script>
</body>
</html>
